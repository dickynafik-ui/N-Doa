<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-Carmadi - Dasbor Utama</title>
  
  <!-- Import Google Font Aref Ruqaa (Gaya Riq'ah) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./output.css">
  
  <style>
    .font-arabic {
      font-family: 'Aref Ruqaa', 'Traditional Arabic', 'Amiri', serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen">
  <div class="max-w-md mx-auto">
    
    <!-- Header Judul dengan Logo N-Carmadi -->
    <header class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm text-center my-6">
      <div class="flex flex-col items-center justify-center mb-2">
        <img src="assets/logo.png" alt="Logo N-Carmadi" class="w-16 h-16 object-contain mb-1">
        <span class="text-xs font-bold text-emerald-700 tracking-widest uppercase">N-Carmadi</span>
      </div>
      <h1 class="text-xl font-bold text-slate-800">Doa & Tawasul</h1>
      <p class="text-slate-500 text-xs mt-1">Pilih menu di bawah ini untuk memulai</p>
    </header>

    <div id="category-list" class="space-y-3"></div>
  </div>

  <script type="module">
    import { MENU_CATEGORIES } from './js/data-menu.js';
    const container = document.getElementById('category-list');
    
    if (container && Array.isArray(MENU_CATEGORIES)) {
      MENU_CATEGORIES.forEach(cat => {
        const card = document.createElement('a');
        card.href = `category.html?id=${cat.id}`;
        card.className = "bg-white p-4 rounded-xl shadow-sm hover:shadow-md border border-slate-200 flex items-center gap-4 transition cursor-pointer";
        card.innerHTML = `
          <div class="text-3xl bg-emerald-50 p-3 rounded-lg">${cat.icon}</div>
          <div>
            <h2 class="text-base font-bold text-slate-800">${cat.title}</h2>
            <p class="text-xs text-slate-500 mt-0.5">${cat.description}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
