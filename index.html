<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-Doa - Dasbor Utama</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen">
  <div class="max-w-md mx-auto">
    <header class="text-center my-6">
      <h1 class="text-2xl font-bold text-emerald-800">N-Doa & Tawasul</h1>
      <p class="text-slate-500 text-sm mt-1">Pilih menu di bawah ini</p>
    </header>

    <div id="category-list" class="space-y-3"></div>
  </div>

  <script type="module">
    import { MENU_CATEGORIES } from './js/data-menu.js';
    const container = document.getElementById('category-list');
    
    MENU_CATEGORIES.forEach(cat => {
      const card = document.createElement('a');
      card.href = `category.html?id=${cat.id}`;
      card.className = "bg-white p-4 rounded-xl shadow-sm hover:shadow-md border border-slate-200 flex items-center gap-4 transition cursor-pointer";
      card.innerHTML = `
        <div class="text-3xl bg-emerald-50 p-3 rounded-lg">${cat.icon}</div>
        <div>
          <h2 class="text-base font-bold text-slate-800">${cat.title}</h2>
          <p class="text-xs text-slate-500 mt-0.5">${cat.description}</p>
        </div>
      `;
      container.appendChild(card);
    });
  </script>
</body>
</html>
