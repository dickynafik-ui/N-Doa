<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Diperbarui agar skala mobile lebih responsif dan aman untuk perangkat ber-notch/dynamic island -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>N-Carmadi - Dasbor Utama</title>
  
  <!-- Import Google Font Aref Ruqaa (Gaya Riq'ah) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./output.css">
  
  <style>
    .font-arabic {
      font-family: 'Aref Ruqaa', 'Traditional Arabic', 'Amiri', serif;
    }
    /* Mencegah teks terpotong aneh di perangkat kecil */
    body {
      -webkit-tap-highlight-color: transparent;
      word-break: break-word;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 sm:p-6 min-h-screen flex flex-col justify-between">
  <div class="w-full max-w-md mx-auto">
    
    <!-- Header Dasbor -->
    <header class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200/80 shadow-sm text-center my-4 sm:my-6">
      <div class="flex flex-col items-center justify-center">
        <!-- Logo Kotak Presisi -->
        <div class="w-16 h-16 mb-3 rounded-xl overflow-hidden shadow-sm flex items-center justify-center bg-slate-900 shrink-0">
          <img src="assets/logo.png" alt="Logo N-Carmadi" class="w-full h-full object-cover">
        </div>
        
        <!-- Label Sub-Brand Hijau -->
        <span class="text-[11px] font-bold text-emerald-700 tracking-wider uppercase mb-1">N-CARMADI</span>
        
        <!-- Judul Utama & Deskripsi -->
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mb-1">Doa & Tawasul</h1>
        <p class="text-slate-500 text-xs">Pilih menu di bawah ini untuk memulai</p>
      </div>
    </header>

    <!-- Daftar Kategori dengan perbaikan tata letak kartu agar tidak berantakan di layar sempit -->
    <div id="category-list" class="space-y-3 pb-6"></div>
  </div>

  <script type="module">
    import { MENU_CATEGORIES } from './js/data-menu.js';
    const container = document.getElementById('category-list');
    
    if (container && Array.isArray(MENU_CATEGORIES)) {
      MENU_CATEGORIES.forEach(cat => {
        const card = document.createElement('a');
        card.href = `category.html?id=${cat.id}`;
        // Menggunakan items-center agar ikon & teks sejajar vertikal dengan rapi di HP kecil
        card.className = "bg-white p-4 rounded-xl shadow-sm active:scale-[0.98] hover:shadow-md border border-slate-200/80 flex items-center gap-3.5 transition-all cursor-pointer";
        card.innerHTML = `
          <div class="text-2xl sm:text-3xl bg-emerald-50 w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center shrink-0 text-emerald-700">${cat.icon}</div>
          <div class="min-w-0 flex-1">
            <h2 class="text-sm sm:text-base font-bold text-slate-800 truncate">${cat.title}</h2>
            <p class="text-xs text-slate-500 mt-0.5 line-clamp-2">${cat.description}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
