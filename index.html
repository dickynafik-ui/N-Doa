<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>N-Carmadi - Dasbor Utama</title>
  
  <!-- Import Google Font Aref Ruqaa (Gaya Riq'ah) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./output.css">
  
  <style>
    .font-arabic {
      font-family: 'Aref Ruqaa', 'Traditional Arabic', 'Amiri', serif;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      word-break: break-word;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 sm:p-6 min-h-screen flex flex-col justify-between">
  <div class="w-full max-w-md mx-auto">
    
    <!-- Header Dasbor (Minimalis & Rapih) -->
    <header class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm text-center mb-6">
      <!-- Kontainer Logo Baru: Lebih kecil dan kompak, menggunakan tata letak blok -->
      <div class="w-24 h-24 mx-auto mb-5 rounded-2xl overflow-hidden shadow-md bg-slate-900 flex items-center justify-center border border-slate-200 p-1.5">
        <img src="assets/logo.png" alt="Logo N-Carmadi" class="w-full h-full object-contain">
      </div>
      
      <div class="space-y-1">
        <!-- Label Sub-Brand -->
        <span class="text-[11px] font-bold text-emerald-700 tracking-widest uppercase block">N-CARMADI</span>
        
        <!-- Judul Utama & Deskripsi -->
        <h1 class="text-2xl font-extrabold text-slate-950 leading-tight">Doa & Tawasul</h1>
        <p class="text-slate-600 text-sm font-medium pt-1">Pilih menu di bawah ini untuk memulai</p>
      </div>
    </header>

    <!-- Daftar Kategori Menu -->
    <div id="category-list" class="space-y-4 pb-6"></div>
  </div>

  <script type="module">
    import { MENU_CATEGORIES } from './js/data-menu.js';
    const container = document.getElementById('category-list');
    
    if (container && Array.isArray(MENU_CATEGORIES)) {
      MENU_CATEGORIES.forEach(cat => {
        const card = document.createElement('a');
        card.href = `category.html?id=${cat.id}`;
        card.className = "bg-white p-4 rounded-xl shadow-sm active:scale-[0.99] hover:shadow-lg border border-slate-200/80 flex items-center gap-4 transition-all duration-150 cursor-pointer";
        card.innerHTML = `
          <div class="text-3xl bg-emerald-50 w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 text-emerald-700">${cat.icon}</div>
          <div class="min-w-0 flex-1 space-y-0.5">
            <h2 class="text-base font-bold text-slate-900 truncate">${cat.title}</h2>
            <p class="text-sm text-slate-600 line-clamp-1">${cat.description}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
