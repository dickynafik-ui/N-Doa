<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>N-Carmadi - Doa & Tawasul</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    Noto Naskh Arabic:
    lebih cocok untuk teks Arab panjang + harakat

    Amiri:
    tetap digunakan sebagai fallback
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       DASAR
       ===================================================== */

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      overflow-x: hidden;
    }


    /* =====================================================
       FONT ARAB
       ===================================================== */

    .font-arabic {
      font-family:
        "Noto Naskh Arabic",
        "Amiri",
        "Traditional Arabic",
        serif;

      direction: rtl;
      unicode-bidi: plaintext;

      text-align: right;

      font-weight: 400;

      /*
        Jangan terlalu kecil.
        Noto Naskh Arabic lebih aman untuk harakat.
      */
      font-size: 30px;

      /*
        Sangat penting:
        memberi ruang vertikal untuk harakat atas/bawah.
      */
      line-height: 2.25;

      letter-spacing: 0;

      /*
        Jangan sampai harakat terpotong.
      */
      overflow: visible;

      white-space: normal;

      word-break: normal;
      overflow-wrap: normal;

      /*
        Ruang tambahan untuk tanda baca/harakat.
      */
      padding-top: 0.25em;
      padding-bottom: 0.35em;

      color: #172033;

      /*
        Membantu rendering font di browser mobile.
      */
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* =====================================================
       KARTU BACAAN
       ===================================================== */

    .nc-reading-card {
      background: #ffffff;

      padding: 16px;

      border-radius: 0.75rem;

      border: 1px solid #e2e8f0;

      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.04);

      overflow: visible;
    }


    /* =====================================================
       JUDUL BAGIAN
       ===================================================== */

    .nc-section-title {
      display: inline-block;

      max-width: 100%;

      line-height: 1.5;

      white-space: normal;

      overflow-wrap: anywhere;
    }


    /* =====================================================
       TEKS ARAB DALAM KARTU
       ===================================================== */

    .nc-arabic {
      margin-top: 10px;
      margin-bottom: 12px;

      /*
        Jangan menggunakan overflow hidden.
        Harakat bisa terpotong jika hidden.
      */
      overflow: visible;

      /*
        Biarkan paragraf Arab membungkus secara alami.
      */
      white-space: pre-line;

      /*
        Sedikit ruang kiri-kanan.
      */
      padding-left: 2px;
      padding-right: 2px;

      /*
        Memastikan baris tidak terlalu rapat.
      */
      line-height: 2.25;
    }


    /*
      Baris kosong dari \n\n tetap mempunyai
      jarak yang wajar.
    */
    .nc-arabic br {
      line-height: 1.2;
    }


    /* =====================================================
       TRANSLITERASI
       ===================================================== */

    .nc-latin {
      direction: ltr;

      text-align: left;

      font-family:
        Arial,
        "Segoe UI",
        sans-serif;

      font-size: 16px;

      font-weight: 500;

      line-height: 1.85;

      color: #166b61;

      margin-top: 12px;

      margin-bottom: 8px;

      /*
        Jangan pecah kata secara aneh.
      */
      word-break: normal;

      overflow-wrap: break-word;

      white-space: normal;
    }


    /* =====================================================
       TERJEMAHAN
       ===================================================== */

    .nc-translation {
      line-height: 1.75;

      margin-top: 12px;

      padding-top: 10px;
    }


    /* =====================================================
       CATATAN
       ===================================================== */

    .nc-note {
      line-height: 1.6;
    }


    /* =====================================================
       MOBILE ANDROID
       ===================================================== */

    @media (max-width: 640px) {

      body {
        padding-left: 10px !important;
        padding-right: 10px !important;
      }


      /*
        Lebar kartu tetap aman di HP kecil.
      */
      .nc-reading-card {
        padding: 14px;

        border-radius: 14px;
      }


      /*
        Ukuran Arab khusus HP.
      */
      .font-arabic,
      .nc-arabic {
        font-size: 27px;

        /*
          Ini yang sangat penting untuk harakat.
        */
        line-height: 2.35;

        padding-top: 0.3em;
        padding-bottom: 0.45em;
      }


      /*
        Transliterasi HP.
      */
      .nc-latin {
        font-size: 15.5px;

        line-height: 1.9;

        margin-top: 10px;
      }


      /*
        Judul kategori.
      */
      .nc-section-title {
        font-size: 12px;
      }


      /*
        Deskripsi kategori.
      */
      #description {
        line-height: 1.6;
      }
    }


    /* =====================================================
       HP SANGAT KECIL
       Contoh 320 - 360 px
       ===================================================== */

    @media (max-width: 360px) {

      .nc-reading-card {
        padding: 12px;
      }

      .font-arabic,
      .nc-arabic {
        font-size: 25px;

        line-height: 2.4;
      }

      .nc-latin {
        font-size: 15px;

        line-height: 1.85;
      }
    }


    /* =====================================================
       TABLET / DESKTOP
       ===================================================== */

    @media (min-width: 641px) {

      .font-arabic,
      .nc-arabic {
        font-size: 32px;

        line-height: 2.3;
      }

      .nc-latin {
        font-size: 16px;

        line-height: 1.9;
      }
    }

  </style>

</head>


<body class="bg-slate-100 text-slate-800 p-3 sm:p-4 min-h-screen">

  <div class="max-w-2xl mx-auto space-y-4">


    <!-- =====================================================

         ===================================================== -->

    <a
      href="index.html"

    >
      ← Kembali ke Dasbor Awal
    </a>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header

      <div class="flex flex-col items-center justify-center mb-2">

        >
          N-Carmadi
        </span>

      </div>

      <h1
        id="title"
        class="text-2xl font-bold text-slate-800"
      ></h1>

      <p
        id="description"

      ></p>

    </header>


    <!-- =====================================================
         DROPDOWN DOA PILIHAN
         ===================================================== -->

    <div
      id="doa-selector"
      class="hidden bg-white p-3 rounded-xl border border-slate-200 shadow-sm"
    >

      <label
        for="doa-dropdown"
        class="block text-xs font-medium text-slate-600 mb-1"
      >
        Pilih Doa:
      </label>

      <select
        id="doa-dropdown"
        class="w-full p-2 text-sm border rounded-lg border-slate-300 bg-white focus:ring-1 focus:ring-emerald-500 outline-none"
      ></select>

    </div>


    <!-- =====================================================
         FORM AHLI KUBUR
         ===================================================== -->

    <div
      id="custom-names-box"
      class="hidden bg-emerald-50 border border-emerald-200 p-3 sm:p-4 rounded-xl space-y-3"
    >

      <div class="flex justify-between items-center">

        <h2 class="font-bold text-emerald-900 text-sm">
          ⚙️ Pengaturan Ahli Kubur / Almarhum(ah)
        </h2>

      </div>

      <p class="text-xs text-emerald-700">
        Isi nama Latin dan nama Arab almarhum/almarhumah keluarga Anda di bawah ini:
      </p>

      <div
        id="names-list"
        class="space-y-3"
      ></div>

      <button
        id="add-person-btn"
        class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm transition-all active:scale-95 cursor-pointer"
      >
        + Tambah Almarhum / Almarhumah
      </button>

    </div>


    <!-- =====================================================
         DAFTAR BACAAN
         ===================================================== -->

    <div
      id="content-list"
      class="space-y-4"
    ></div>


  </div>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script type="module">

    import {
      prayersData,
      MENU_CATEGORIES
    } from './js/data-menu.js';


    /* =====================================================
       URL CATEGORY
       ===================================================== */

    const urlParams =
      new URLSearchParams(window.location.search);

    let categoryId =
      urlParams.get('id');


    if (
      categoryId === 'doa' ||
      categoryId?.startsWith('doa:')
    ) {
      categoryId = 'doa_pilihan';
    }


    /* =====================================================
       KONVERSI LATIN → ARAB
       ===================================================== */

    function latinToArabic(text) {

      if (!text) return "";

      const dictionary = {

        'bin': 'بْنِ',
        'binti': 'بِنْتِ',
        'didi': 'دِيْدِي',
        'carmadi': 'جَرْمَادِي',
        'waskim': 'وَاسْكِمْ',
        'fitriah': 'فِطْرِيَّة',
        'fitri': 'فِطْرِي',
        'muhammad': 'مُحَمَّد',
        'ahmad': 'أَحْمَد',
        'ali': 'عَلِيّ',
        'fatimah': 'فَاطِمَة'

      };


      let words =
        text
          .trim()
          .toLowerCase()
          .split(/\s+/);


      let arabicWords =
        words.map(word => {

          if (dictionary[word]) {
            return dictionary[word];
          }


          return word

            .replace(/kh/g, 'خ')
            .replace(/gh/g, 'غ')
            .replace(/sh/g, 'ش')
            .replace(/sy/g, 'ش')
            .replace(/th/g, 'ط')
            .replace(/dz/g, 'ذ')

            .replace(/a/g, 'َا')
            .replace(/i/g, 'ِي')
            .replace(/u/g, 'ُوْ')
            .replace(/e/g, 'ِ')
            .replace(/o/g, 'و')

            .replace(/b/g, 'ب')
            .replace(/c/g, 'ج')
            .replace(/d/g, 'د')
            .replace(/f/g, 'ف')
            .replace(/g/g, 'غ')
            .replace(/h/g, 'ه')
            .replace(/j/g, 'ج')
            .replace(/k/g, 'ك')
            .replace(/l/g, 'ل')
            .replace(/m/g, 'م')
            .replace(/n/g, 'ن')
            .replace(/p/g, 'ف')
            .replace(/q/g, 'ق')
            .replace(/r/g, 'ر')
            .replace(/s/g, 'س')
            .replace(/t/g, 'ت')
            .replace(/v/g, 'ف')
            .replace(/w/g, 'و')
            .replace(/y/g, 'ي')
            .replace(/z/g, 'ز');

        });


      return arabicWords.join(' ');
    }


    /* =====================================================
       DATA ALMARHUM / ALMARHUMAH
       ===================================================== */

    let localPersons =
      JSON.parse(
        localStorage.getItem('custom_ahli_kubur')
      ) || [

        {
          id: 1,
          section: "Khusus untuk Almarhum Ayahanda",
          relation: "father",
          gender: "male",
          name: "Didi Carmadi bin Waskim",
          arabic_name: "دِيْدِي جَرْمَادِي بْنِ وَاسْكِمْ"
        },

        {
          id: 2,
          section: "Khusus untuk Almarhumah Saudari / Teteh",
          relation: "sister",
          gender: "female",
          name: "Fitriah binti Didi Carmadi",
          arabic_name: "فِطْرِيَّة بِنْتِ دِيْدِي جَرْمَادِي"
        }

      ];


    /* =====================================================
       SIMPAN DATA
       ===================================================== */

    function saveLocalPersons() {

      localStorage.setItem(
        'custom_ahli_kubur',
        JSON.stringify(localPersons)
      );

      renderContent();
    }


    /* =====================================================
       RENDER CONTENT
       ===================================================== */

    function renderContent() {

      const categoryInfo =
        MENU_CATEGORIES?.find(
          c => c.id === categoryId
        );

      const data =
        prayersData?.[categoryId];


      const titleEl =
        document.getElementById('title');

      const descEl =
        document.getElementById('description');

      const container =
        document.getElementById('content-list');


      if (!data) {

        if (titleEl) {
          titleEl.innerText =
            "Data tidak ditemukan";
        }

        return;
      }


      if (titleEl) {
        titleEl.innerText =
          data.title || '';
      }


      if (descEl) {

        descEl.innerText =
          categoryInfo
            ? categoryInfo.description
            : '';

      }


      if (!container) return;


      container.innerHTML = '';


      /* =================================================
         BOX AHLI KUBUR
         ================================================= */

      const box =
        document.getElementById(
          'custom-names-box'
        );


      if (box) {

        if (
          categoryId === 'tawasul' ||
          categoryId === 'doa_pilihan' ||
          categoryId === 'doa'
        ) {

          box.classList.remove('hidden');

          renderCustomNamesManager();

        } else {

          box.classList.add('hidden');

        }

      }


      /* =================================================
         DATA ITEMS
         ================================================= */

      if (data.items) {

        const selectorBox =
          document.getElementById(
            'doa-selector'
          );

        if (selectorBox) {
          selectorBox.classList.add('hidden');
        }

        renderItems(
          data.items,
          container
        );

      }


      /* =================================================
         LIST DOA
         ================================================= */

      else if (
        data.listDoa &&
        data.listDoa.length > 0
      ) {

        const selectorBox =
          document.getElementById(
            'doa-selector'
          );

        const dropdown =
          document.getElementById(
            'doa-dropdown'
          );


        if (selectorBox) {
          selectorBox.classList.remove('hidden');
        }


        if (dropdown) {

          dropdown.innerHTML =
            data.listDoa
              .map(
                (d, i) =>
                  `<option value="${i}">
                    ${d.title}
                  </option>`
              )
              .join('');


          function displaySelectedDoa(index) {

            container.innerHTML = '';

            const selected =
              data.listDoa[index];


            if (
              selected &&
              selected.items
            ) {

              renderItems(
                selected.items,
                container
              );

            }

          }


          dropdown.onchange =
            e =>
              displaySelectedDoa(
                e.target.value
              );


          displaySelectedDoa(0);

        }

      }

    }


    /* =====================================================
       RENDER ITEMS
       ===================================================== */

    function renderItems(
      items,
      container
    ) {

      items.forEach(item => {

        if (item.type !== 'ahli_kubur') {

          container.appendChild(
            createCard(item)
          );

        } else {

          localPersons.forEach(
            (person, idx) => {

              const isMale =
                person.gender === 'male';


              const arName =
                person.arabic_name ||
                latinToArabic(person.name);


              let arRelation = "";
              let latinRelation = "";


              if (
                person.relation === 'father'
              ) {

                arRelation = " أَبِيْنَا";
                latinRelation = " abīnā";

              }

              else if (
                person.relation === 'mother'
              ) {

                arRelation = " أُمِّنَا";
                latinRelation = " umminā";

              }

              else if (
                person.relation === 'brother'
              ) {

                arRelation = " أَخِيْنَا";
                latinRelation = " akhīnā";

              }

              else if (
                person.relation === 'sister'
              ) {

                arRelation = " أُخْتِنَا";
                latinRelation = " ukhtinā";

              }


              let arText = "";
              let latinText = "";


              if (
                categoryId === 'tawasul'
              ) {

                if (isMale) {

                  arText =
                    `وَخُصُوْصًا إِلَى رُوْحِ${arRelation} الْمَغْفُوْرِ لَهُ ${arName}. اَللّٰهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مَدْخَلَهُ، وَاجْعَلِ الْجَنَّةَ مَثْوَاهُ، شَيْءٌ لِلّٰهِ لَهُ، الْفَاتِحَةُ...`;

                  latinText =
                    `Wa khushūshan ilā rūhi${latinRelation} al-maghfūr lah ${person.name}. Allāhummaghfir lahū warhamhū wa 'āfihī wa'fu 'anhū, wa akrim nuzulahū wa wassi' madkhalahū, waj'alil-jannata matswāhu, syai'un lillāhi lahū, Al-Fātiḥah...`;

                }

                else {

                  arText =
                    `وَخُصُوْصًا إِلَى رُوْحِ${arRelation} الْمَغْفُوْرِ لَهَا ${arName}. اَللّٰهُمَّ اغْفِرْ لَهَا وَارْحَمْهَا وَعَافِهَا وَاعْفُ عَنْهَا، وَأَكْرِمْ نُزُلَهَا وَوَسِّعْ مَدْخَلَهَا، وَاجْعَلِ الْجَنَّةَ مَثْوَاهَا، شَيْءٌ لِلّٰهِ لَهَا، الْفَاتِحَةُ...`;

                  latinText =
                    `Wa khushūshan ilā rūhi${latinRelation} al-maghfūr lahā ${person.name}. Allāhummaghfir lahā warhamhā wa 'āfihā wa'fu 'anhā, wa akrim nuzulahā wa wassi' madkhalahā, waj'alil-jannata matswāhā, syai'un lillāhi lahā, Al-Fātiḥah...`;

                }

              }

              else {

                arText =
                  isMale

                    ? `اَللّٰهُمَّ خُصُوْصًا إِلَى رُوْحِ ${arName}

اَللّٰهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ. وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مَدْخَلَهُ. وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ. وَنَقِّهِ مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ.

اَللّٰهُمَّ أَنْزِلِ الرَّحْمَةَ وَالْمَغْفِرَةَ عَلَى قَبْرِهِ. وَاجْعَلْ قَبْرَهُ رَوْضَةً مِنْ رِيَاضِ الْجَنَّةِ، وَلَا تَجْعَلْ قَبْرَهُ حُفْرَةً مِنْ حُفَرِ النِّيْرَانِ. اَللّٰهُمَّ جَازِهِ بِالْإِحْسَانِ إِحْسَانًا، وَبِالسَّيِّئَاتِ عَفْوًا وَغُفْرَانًا.`

                    : `اَللّٰهُمَّ خُصُوْصًا إِلَى رُوْحِ ${arName}

اَللّٰهُمَّ اغْفِرْ لَهَا وَارْحَمْهَا وَعَافِهَا وَاعْفُ عَنْهَا. وَأَكْرِمْ نُزُلَهَا وَوَسِّعْ مَدْخَلَهَا. وَاغْسِلْهَا بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ. وَنَقِّهَا مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ.

اَللّٰهُمَّ أَنْزِلِ الرَّحْمَةَ وَالْمَغْفِرَةَ عَلَى قَبْرِهَا. وَاجْعَلْ قَبْرَهَا رَوْضَةً مِنْ رِيَاضِ الْجَنَّةِ، وَلَا تَجْعَلْ قَبْرَهَا حُفْرَةً مِنْ حُفَرِ النِّيْرَانِ. اَللّٰهُمَّ جَازِهَا بِالْإِحْسَانِ إِحْسَانًا، وَبِالسَّيِّئَاتِ عَفْوًا وَغُفْرَانًا.`;
                

                latinText =

                  isMale

                    ? `Allāhumma khushūshan ilā rūhi ${person.name}

Allāhummaghfir lahū, warhamhū, wa 'āfihī, wa'fu 'anhū. Wa akrim nuzulahū, wa wassi' madkhalahū. Waghsilhu bil-mā'i wats-tsalji wal-barad. Wa naqqihī minal-khathāyā kamā yunaqqats-tsaubul-abyadhu minad-danas.

Allāhumma anzilir-rahmata wal-maghfirata 'alā qabrihī. Waj'al qabrahū raudhatan min riyādhil-jannah. Wa lā taj'al qabrahū hufratan min hufarin-nīrān. Allāhumma jāzihī bil-ihsāni ihsānā, wa bis-sayyi'āti 'afwan wa ghufrānā.`

                    : `Allāhumma khushūshan ilā rūhi ${person.name}

Allāhummaghfir lahā, warhamhā, wa 'āfihā, wa'fu 'anhā. Wa akrim nuzulahā, wa wassi' madkhalahā. Waghsilhā bil-mā'i wats-tsalji wal-barad. Wa naqqihā minal-khathāyā kamā yunaqqats-tsaubul-abyadhu minad-danas.

Allāhumma anzilir-rahmata wal-maghfirata 'alā qabrihā. Waj'al qabrahā raudhatan min riyādhil-jannah. Wa lā taj'al qabrahā hufratan min hufarin-nīrān. Allāhumma jāzihā bil-ihsāni ihsānā, wa bis-sayyi'āti 'afwan wa ghufrānā.`;

              }


              const customCardData = {

                number:
                  `${item.number || '7'}${String.fromCharCode(97 + idx)}`,

                section:
                  person.section,

                arabic:
                  arText,

                latin:
                  latinText,

                note:
                  categoryId === 'tawasul'
                    ? "👉 Jamaah membaca Al-Fatihah 1x"
                    : undefined

              };


              container.appendChild(
                createCard(customCardData)
              );

            }
          );

        }

      });

    }


    /* =====================================================
       CREATE CARD
       ===================================================== */

    function createCard(item) {

      const card =
        document.createElement('div');


      card.className =
        "nc-reading-card space-y-3";


      let headerText =
        item.section
          ? `${item.number ? item.number + '. ' : ''}${item.section}`
          : `Ayat / Bacaan #${item.number || ''}`;


      /*
        Escape sederhana untuk keamanan HTML.
      */
      const safeHeader =
        String(headerText)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');


      /*
        Arab:
        \n tetap digunakan untuk paragraf.
      */
      const arabicHTML =
        String(item.arabic || '')
          .replace(/\n/g, '<br>');


      /*
        Transliterasi:
        Slash "/" tidak lagi dibuat menjadi
        potongan-potongan baris.
      */
      const latinHTML =
        String(item.latin || '')
          .replace(/\s*\/\s*/g, ' ')
          .replace(/\n/g, '<br>');


      card.innerHTML = `

        <!-- Judul bacaan -->
        <div
          class="flex justify-between items-start text-xs font-semibold text-emerald-700"
        >

          <span
            class="nc-section-title bg-emerald-50 px-2.5 py-1 rounded-full"
          >
            ${safeHeader}
          </span>

        </div>


        <!-- ==============================
             ARAB
             ============================== -->

        <p
          class="nc-arabic font-arabic"
          dir="rtl"
          lang="ar"
        >
          ${arabicHTML}
        </p>


        <!-- ==============================
             TRANSLITERASI
             ============================== -->

        ${
          item.latin
            ? `
              <p class="nc-latin">
                ${latinHTML}
              </p>
            `
            : ''
        }


        <!-- ==============================
             TERJEMAHAN
             ============================== -->

        ${
          item.translation
            ? `
              <p class="nc-translation text-xs text-slate-600 italic border-t border-slate-100">
                ${item.translation}
              </p>
            `
            : ''
        }


        <!-- ==============================
             CATATAN
             ============================== -->

        ${
          item.note
            ? `
              <p class="nc-note text-xs font-medium text-amber-800 bg-amber-50 p-2.5 rounded-lg border border-amber-200">
                ${item.note}
              </p>
            `
            : ''
        }

      `;


      return card;

    }


    /* =====================================================
       MANAGER AHLI KUBUR
       ===================================================== */

    function renderCustomNamesManager() {

      const listEl =
        document.getElementById('names-list');


      if (!listEl) return;


      listEl.innerHTML = '';


      localPersons.forEach(
        (person, index) => {

          const itemEl =
            document.createElement('div');


          itemEl.className =
            "bg-white p-3 rounded-lg border border-slate-200 shadow-sm space-y-2 text-xs";


          itemEl.innerHTML = `

            <div
              class="flex justify-between items-center border-b pb-1.5 border-slate-100"
            >

              <span class="font-bold text-slate-700">
                Data #${index + 1}
              </span>

              <button
                onclick="deletePerson(${index})"
                class="text-red-500 font-semibold text-xs hover:text-red-700 bg-red-50 px-2 py-0.5 rounded cursor-pointer"
              >
                Hapus
              </button>

            </div>


            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">

              <div>

                <label
                  class="block text-[10px] text-slate-500 mb-0.5"
                >
                  Keterangan / Judul
                </label>

                <input
                  type="text"
                  value="${person.section || ''}"
                  onchange="updatePerson(${index}, 'section', this.value)"
                  placeholder="Khusus Almarhum..."
                  class="w-full p-2 border rounded border-slate-300 focus:ring-1 focus:ring-emerald-500 outline-none"
                >

              </div>


              <div>

                <label
                  class="block text-[10px] text-slate-500 mb-0.5"
                >
                  Panggilan / Hubungan
                </label>

                <select
                  onchange="updatePerson(${index}, 'relation', this.value)"
                  class="w-full p-2 border rounded border-slate-300 bg-white"
                >

                  <option
                    value="general"
                    ${(!person.relation || person.relation === 'general') ? 'selected' : ''}
                  >
                    Umum / Tanpa Sebutan
                  </option>

                  <option
                    value="father"
                    ${person.relation === 'father' ? 'selected' : ''}
                  >
                    Ayahanda (أَبِيْنَا)
                  </option>

                  <option
                    value="mother"
                    ${person.relation === 'mother' ? 'selected' : ''}
                  >
                    Ibunda (أُمِّنَا)
                  </option>

                  <option
                    value="brother"
                    ${person.relation === 'brother' ? 'selected' : ''}
                  >
                    Saudara (أَخِيْنَا)
                  </option>

                  <option
                    value="sister"
                    ${person.relation === 'sister' ? 'selected' : ''}
                  >
                    Saudari (أُخْتِنَا)
                  </option>

                </select>

              </div>


              <div>

                <label
                  class="block text-[10px] text-slate-500 mb-0.5"
                >
                  Jenis Kelamin
                </label>

                <select
                  onchange="updatePerson(${index}, 'gender', this.value)"
                  class="w-full p-2 border rounded border-slate-300 bg-white"
                >

                  <option
                    value="male"
                    ${person.gender === 'male' ? 'selected' : ''}
                  >
                    Laki-Laki (الْمَغْفُوْرِ لَهُ)
                  </option>

                  <option
                    value="female"
                    ${person.gender === 'female' ? 'selected' : ''}
                  >
                    Perempuan (الْمَغْفُوْرِ لَهَا)
                  </option>

                </select>

              </div>

            </div>


            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">

              <div>

                <label
                  class="block text-[10px] text-slate-500 mb-0.5"
                >
                  Nama Latin
                </label>

                <input
                  type="text"
                  value="${person.name}"
                  onchange="updateNameAndAutoArabic(${index}, this.value)"
                  placeholder="Nama bin/binti Fulan"
                  class="w-full p-2 border rounded border-slate-300 focus:ring-1 focus:ring-emerald-500 outline-none"
                >

              </div>


              <div>

                <label
                  class="block text-[10px] text-slate-500 mb-0.5"
                >
                  Nama Arab (Dapat Disunting)
                </label>

                <input
                  type="text"
                  value="${person.arabic_name || latinToArabic(person.name)}"
                  onchange="updatePerson(${index}, 'arabic_name', this.value)"
                  placeholder="Nama Arab"
                  class="w-full p-2 border rounded border-slate-300 text-right font-arabic text-emerald-800 focus:ring-1 focus:ring-emerald-500 outline-none"
                  dir="rtl"
                >

              </div>

            </div>

          `;


          listEl.appendChild(itemEl);

        }
      );

    }


    /* =====================================================
       UPDATE DATA
       ===================================================== */

    window.updateNameAndAutoArabic =
      (index, value) => {

        localPersons[index].name =
          value;

        localPersons[index].arabic_name =
          latinToArabic(value);

        saveLocalPersons();

      };


    window.updatePerson =
      (index, field, value) => {

        localPersons[index][field] =
          value;

        saveLocalPersons();

      };


    window.deletePerson =
      (index) => {

        localPersons.splice(
          index,
          1
        );

        saveLocalPersons();

      };


    /* =====================================================
       TAMBAH ALMARHUM
       ===================================================== */

    const addBtn =
      document.getElementById(
        'add-person-btn'
      );


    if (addBtn) {

      addBtn.addEventListener(
        'click',
        () => {

          localPersons.push({

            id: Date.now(),

            section:
              "Khusus Almarhum",

            relation:
              "general",

            gender:
              "male",

            name:
              "Nama bin Fulan",

            arabic_name:
              "فلان بن فلان"

          });


          saveLocalPersons();

        }
      );

    }


    /* =====================================================
       START
       ===================================================== */

    renderContent();

  </script>

</body>
