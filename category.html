<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-Doa - Bacaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen">
  <div class="max-w-2xl mx-auto space-y-4">
    <a href="index.html" class="inline-flex items-center gap-1 text-emerald-700 font-medium text-sm hover:underline">
      ← Kembali ke Dasbor Awal
    </a>

    <header class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <h1 id="title" class="text-2xl font-bold text-slate-800"></h1>
      <p id="description" class="text-slate-500 text-sm mt-1"></p>
    </header>

    <!-- Tempat menampilkan daftar ayat / doa -->
    <div id="content-list" class="space-y-4"></div>
  </div>

  <script type="module">
    import { prayersData, MENU_CATEGORIES } from './js/data-menu.js';

    // Ambil ID dari URL (?id=yasin)
    const urlParams = new URLSearchParams(window.location.search);
    const categoryId = urlParams.get('id');

    const categoryInfo = MENU_CATEGORIES.find(c => c.id === categoryId);
    const data = prayersData[categoryId];

    if (data && data.items) {
      document.getElementById('title').innerText = data.title;
      document.getElementById('description').innerText = categoryInfo ? categoryInfo.description : '';

      const container = document.getElementById('content-list');
      container.innerHTML = '';

      data.items.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-center text-xs font-semibold text-emerald-700">
            <span class="bg-emerald-50 px-2.5 py-1 rounded-full">Ayat / Bacaan #${item.number}</span>
          </div>
          <p class="text-right text-2xl font-serif leading-loose text-slate-800" dir="rtl">${item.arabic}</p>
          <p class="text-sm font-medium text-emerald-800 leading-relaxed">${item.latin}</p>
          <p class="text-xs text-slate-600 leading-relaxed italic border-t border-slate-100 pt-2">${item.translation}</p>
        `;
        container.appendChild(card);
      });
    } else {
      document.getElementById('title').innerText = "Data tidak ditemukan";
      document.getElementById('description').innerText = "Silakan kembali ke menu utama.";
    }
  </script>
</body>
</html>
